<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tab Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0f1e; --surface: #111827; --border: #1f2937;
      --accent: #6366f1; --text: #f1f5f9; --muted: #64748b;
      --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 400px; min-height: 400px; max-height: 580px; overflow: hidden; display: flex; flex-direction: column; }

    header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .logo { font-size: 14px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tab-count { font-size: 12px; color: var(--muted); }

    .search-bar { padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .search-bar input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; padding: 7px 12px; outline: none; }
    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--muted); }

    .nav-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .nav-tab { flex: 1; padding: 8px; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .panel { display: none; flex: 1; overflow-y: auto; padding: 8px; }
    .panel.active { display: block; }

    /* Domain groups */
    .domain-group { margin-bottom: 8px; }
    .domain-header { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface); border-radius: 6px; cursor: pointer; }
    .domain-favicon { width: 14px; height: 14px; border-radius: 2px; }
    .domain-name { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .domain-badge { background: var(--accent); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
    .tab-list { padding: 2px 0 2px 22px; display: none; }
    .tab-list.open { display: block; }
    .tab-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer; transition: background .1s; }
    .tab-item:hover { background: var(--surface); }
    .tab-title { font-size: 12px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close { font-size: 14px; color: var(--muted); padding: 2px 4px; border-radius: 3px; cursor: pointer; opacity: 0; transition: opacity .1s; }
    .tab-item:hover .tab-close { opacity: 1; }
    .tab-close:hover { color: var(--red); background: rgba(239,68,68,.1); }

    /* Saved groups */
    .saved-group { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .saved-group-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .saved-group-name { font-size: 13px; font-weight: 700; }
    .saved-group-meta { font-size: 11px; color: var(--muted); }
    .saved-group-actions { display: flex; gap: 6px; }
    .btn-sm { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 5px; cursor: pointer; border: none; transition: opacity .15s; }
    .btn-restore { background: var(--accent); color: white; }
    .btn-delete { background: transparent; border: 1px solid var(--border) !important; color: var(--muted); }
    .btn-delete:hover { border-color: var(--red) !important; color: var(--red); }
    .btn-sm:hover { opacity: .85; }

    /* Save form */
    .save-form { padding: 8px; background: var(--surface); border-radius: 8px; margin-bottom: 8px; display: flex; gap: 8px; }
    .save-form input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; padding: 7px 10px; outline: none; }
    .save-form input:focus { border-color: var(--accent); }
    .btn-save { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }

    /* Duplicates */
    .dupe-item { background: var(--surface); border: 1px solid rgba(245,158,11,.25); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .dupe-url { font-size: 11px; color: var(--yellow); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dupe-tabs { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .btn-close-dupes { background: var(--red); color: white; border: none; border-radius: 5px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-dismiss { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 5px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 6px; }

    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 20px; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">Smart Tab Manager</span>
    <span class="tab-count" id="tab-count">Loading…</span>
  </header>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search tabs…" autocomplete="off">
  </div>

  <div class="nav-tabs">
    <div class="nav-tab active" data-panel="tabs-panel">Tabs</div>
    <div class="nav-tab" data-panel="groups-panel">Saved</div>
    <div class="nav-tab" data-panel="dupes-panel">Dupes <span id="dupe-badge" style="display:none; background:#ef4444; color:white; font-size:10px; padding:1px 5px; border-radius:10px; margin-left:3px;"></span></div>
  </div>

  <div id="tabs-panel" class="panel active"></div>
  <div id="groups-panel" class="panel">
    <div class="save-form">
      <input type="text" id="group-name" placeholder="Name this tab group…">
      <button class="btn-save" id="save-group-btn">Save All</button>
    </div>
    <div id="saved-groups-list"></div>
  </div>
  <div id="dupes-panel" class="panel"></div>

  <script src="popup.js"></script>
</body>
</html>
